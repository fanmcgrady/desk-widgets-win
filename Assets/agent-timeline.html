<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Timeline</title>
  <style>
    :root {
      --accent: #0078d4;
      --accent-soft: rgba(0, 120, 212, 0.12);
      --fg: #1a1a1a;
      --muted: #6b6b6b;
      --line: rgba(0, 0, 0, 0.08);
      --bg: #f3f3f3;
      --panel: #ffffff;
      --run: #0078d4;
      --fail: #c42b1c;
      --mono: Consolas, "Cascadia Mono", "Microsoft YaHei UI", monospace;
      --sans: "Segoe UI", "Microsoft YaHei UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      font-family: var(--sans);
      color: var(--fg);
    }
    #timeline {
      height: 100%;
      overflow: auto;
      padding: 10px 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .sys {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble-user {
      align-self: flex-end;
      max-width: 88%;
      background: var(--accent);
      color: #fff;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble-ai {
      align-self: flex-start;
      max-width: 94%;
      background: var(--accent-soft);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      word-break: break-word;
    }
    .bubble-ai.streaming {
      white-space: pre-wrap;
      font-family: var(--sans);
    }
    .bubble-ai.md p { margin: 0 0 8px; }
    .bubble-ai.md p:last-child { margin-bottom: 0; }
    .bubble-ai.md code {
      font-family: var(--mono);
      font-size: 12px;
      background: rgba(0,0,0,0.06);
      padding: 1px 4px;
      border-radius: 4px;
    }
    .bubble-ai.md pre {
      margin: 6px 0;
      padding: 8px;
      background: rgba(0,0,0,0.05);
      border-radius: 6px;
      overflow-x: auto;
      font-family: var(--mono);
      font-size: 12px;
    }
    .bubble-ai.md table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin: 6px 0;
    }
    .bubble-ai.md th, .bubble-ai.md td {
      border: 1px solid rgba(0,0,0,0.12);
      padding: 4px 6px;
      text-align: left;
    }
    .bubble-ai.md th { background: var(--accent-soft); }
    .bubble-ai.md ul, .bubble-ai.md ol { margin: 4px 0 8px; padding-left: 1.2em; }
    .bubble-ai.md a { color: var(--accent); }
    .rail {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 2px 0 2px 6px;
      padding-left: 12px;
      border-left: 1px dashed rgba(0,0,0,0.14);
    }
    .tool {
      position: relative;
      padding: 9px 11px 9px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      font-size: 12px;
    }
    .tool::before {
      content: "";
      position: absolute;
      left: 0;
      top: 10px;
      bottom: 10px;
      width: 3px;
      border-radius: 2px;
      background: #8a8a8a;
    }
    .tool.running::before { background: var(--run); }
    .tool.fail::before { background: var(--fail); }
    .tool-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .tool-kind { font-weight: 600; font-size: 12.5px; }
    .tool-state { font-size: 11px; color: var(--muted); }
    .tool.running .tool-state { color: var(--run); }
    .tool.fail .tool-state { color: var(--fail); }
    .tool-detail {
      margin-top: 4px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11.5px;
      word-break: break-all;
    }
    .tool-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div id="timeline"></div>
  <script>
    const root = document.getElementById("timeline");
    let currentAssistant = null;
    let currentRail = null;
    const tools = new Map();

    function scrollEnd() {
      root.scrollTop = root.scrollHeight;
    }

    function clearAll() {
      root.innerHTML = "";
      currentAssistant = null;
      currentRail = null;
      tools.clear();
    }

    function appendSystem(text) {
      currentAssistant = null;
      currentRail = null;
      const el = document.createElement("div");
      el.className = "sys";
      el.textContent = text || "";
      root.appendChild(el);
      scrollEnd();
    }

    function appendUser(text) {
      currentAssistant = null;
      currentRail = null;
      const el = document.createElement("div");
      el.className = "bubble-user";
      el.textContent = text || "";
      root.appendChild(el);
      scrollEnd();
    }

    function ensureAssistant() {
      if (currentAssistant) return currentAssistant;
      currentRail = null;
      const el = document.createElement("div");
      el.className = "bubble-ai streaming";
      el.dataset.streaming = "1";
      root.appendChild(el);
      currentAssistant = el;
      return el;
    }

    function appendDelta(text) {
      const el = ensureAssistant();
      el.textContent = (el.textContent || "") + (text || "");
      scrollEnd();
    }

    function sealAssistant(html) {
      if (!currentAssistant) {
        if (!html) return;
        ensureAssistant();
      }
      const el = currentAssistant;
      if (!el) return;
      if (!html) {
        el.remove();
        currentAssistant = null;
        return;
      }
      el.className = "bubble-ai md";
      el.removeAttribute("data-streaming");
      el.innerHTML = html;
      currentAssistant = null;
      scrollEnd();
    }

    function dropStream() {
      if (currentAssistant && currentAssistant.dataset.streaming === "1") {
        currentAssistant.remove();
      }
      currentAssistant = null;
    }

    function ensureRail() {
      if (currentRail && currentRail.isConnected) return currentRail;
      const rail = document.createElement("div");
      rail.className = "rail";
      root.appendChild(rail);
      currentRail = rail;
      return rail;
    }

    function upsertTool(msg) {
      currentAssistant = null;
      const callId = msg.callId || "";
      let card = tools.get(callId);
      if (!card) {
        card = document.createElement("div");
        card.className = "tool running";
        card.innerHTML =
          '<div class="tool-top"><span class="tool-kind"></span><span class="tool-state"></span></div>' +
          '<div class="tool-detail"></div>' +
          '<div class="tool-meta"></div>';
        ensureRail().appendChild(card);
        tools.set(callId, card);
      }
      const state = msg.state || "running";
      card.className = "tool " + state;
      card.querySelector(".tool-kind").textContent = msg.label || msg.kind || "工具";
      const detail = card.querySelector(".tool-detail");
      if (msg.detail) {
        detail.style.display = "";
        detail.textContent = msg.detail;
      } else {
        detail.style.display = "none";
        detail.textContent = "";
      }
      const meta = card.querySelector(".tool-meta");
      const stateEl = card.querySelector(".tool-state");
      if (state === "running") {
        stateEl.textContent = "进行中…";
        meta.textContent = "";
        meta.style.display = "none";
      } else if (state === "fail") {
        stateEl.textContent = "失败";
        meta.textContent = msg.summary || "";
        meta.style.display = msg.summary ? "" : "none";
      } else {
        stateEl.textContent = "完成";
        meta.textContent = msg.summary || "完成";
        meta.style.display = "";
      }
      scrollEnd();
    }

    function handle(msg) {
      if (!msg || !msg.op) return;
      switch (msg.op) {
        case "clear": clearAll(); break;
        case "system": appendSystem(msg.text); break;
        case "user": appendUser(msg.text); break;
        case "delta": appendDelta(msg.text); break;
        case "seal": sealAssistant(msg.html || ""); break;
        case "dropStream": dropStream(); break;
        case "tool": upsertTool(msg); break;
        case "scroll": scrollEnd(); break;
      }
    }

    if (window.chrome && chrome.webview) {
      chrome.webview.addEventListener("message", (e) => handle(e.data));
    }
  </script>
</body>
</html>
